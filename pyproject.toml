[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-forge"
version = "0.1.0"
description = "Privileged manipulation solver and demonstration trajectory factory for embodied scenario packages."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Trajectory Forge Contributors"}
]
dependencies = [
  "pyyaml>=6.0",
  "typing-extensions>=4.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "jsonschema>=4.18",
  "numpy>=1.24",
  "ruff>=0.5",
  "mypy>=1.8",
]

[project.scripts]
trajectory-forge = "trajectory_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "local_artifacts: requires repository-external /cpfs scenario-forge r3 artifacts",
]
